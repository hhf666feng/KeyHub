<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">keyHub — Local password manager for AI agents</title>
  <desc id="desc">Passwords, API keys, and SSH credentials stay in a local encrypted vault. keyHub performs credential actions for agents through MCP without returning hidden plaintext by default.</desc>
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,"Liberation Mono",monospace}.white{fill:#f4f2ed}.muted{fill:#aaa9a5}.orange{fill:#ed4a1a}.label{font-size:12px;letter-spacing:1.4px}.body{font-size:17px}
    </style>
  </defs>
  <rect width="1280" height="640" fill="#101214"/>
  <rect width="1280" height="6" fill="#303336"/>
  <rect width="320" height="6" class="orange"/>
  <g transform="translate(56 53)">
    <path d="M0 4h25v6H6v7h19v15H0v-6h19v-5H0z" fill="#f4f2ed"/>
    <rect x="19" y="17" width="6" height="9" class="orange"/>
    <text x="43" y="28" class="sans white" font-size="28" font-weight="700">keyHub</text>
    <text x="0" y="86" class="mono muted label">LOCAL CREDENTIALS · MCP</text>
    <g class="sans" font-size="53" font-weight="700" letter-spacing="-1.5">
      <text x="0" y="172" class="white">Your agents work.</text>
      <text x="0" y="238" class="white">Your secrets</text>
      <text x="0" y="304" class="orange">stay out of context.</text>
    </g>
    <text x="0" y="368" class="sans muted body">Local password and credential manager</text>
    <text x="0" y="395" class="sans muted body">for AI agents. Hidden plaintext stays out</text>
    <text x="0" y="422" class="sans muted body">of model context by default.</text>
    <g transform="translate(0 476)" class="mono label white">
      <rect width="7" height="7" y="-8" class="orange"/>
      <text x="18">OPEN SOURCE</text>
      <rect x="160" width="7" height="7" y="-8" fill="#9da9b6"/>
      <text x="178">NO ACCOUNT</text>
      <rect x="320" width="7" height="7" y="-8" fill="#e6e3de"/>
      <text x="338">LOCAL FIRST</text>
    </g>
  </g>
  <g transform="translate(724 135)">
    <rect width="500" height="390" fill="#1b1e20" stroke="#44494c"/>
    <rect width="500" height="5" class="orange"/>
    <text x="28" y="43" class="mono muted label">01 / AGENT REQUEST</text>
    <text x="28" y="82" class="sans white" font-size="25" font-weight="700">“Sign in and keep going.”</text>
    <path d="M28 108h444" stroke="#44494c"/>
    <text x="28" y="146" class="mono muted label">02 / keyHub</text>
    <g transform="translate(28 168)" class="mono" font-size="12">
      <rect width="138" height="42" fill="#ed4a1a"/>
      <text x="69" y="26" text-anchor="middle" class="white">PASSWORDS</text>
      <rect x="152" width="138" height="42" fill="#303336"/>
      <text x="221" y="26" text-anchor="middle" class="white">API KEYS</text>
      <rect x="304" width="138" height="42" fill="#303336"/>
      <text x="373" y="26" text-anchor="middle" class="white">SSH KEYS</text>
    </g>
    <text x="28" y="247" class="sans muted body">Encrypted locally. Used when needed.</text>
    <path d="M28 274h444" stroke="#44494c"/>
    <text x="28" y="310" class="mono muted label">03 / AUTHENTICATED ACTION</text>
    <text x="28" y="350" class="sans white" font-size="23" font-weight="700">Browser · Terminal · SSH · API</text>
  </g>
  <path d="M56 579h1168" stroke="#303336"/>
  <text x="56" y="611" class="mono muted label">WINDOWS / macOS / LINUX</text>
  <text x="1224" y="611" text-anchor="end" class="mono muted label">keyHub · YOUR LOCAL KEYRING</text>
</svg>
