<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KeyHub · Passkey</title><link rel="stylesheet" href="popup.css"></head>
<body class="request-page"><header><img class="mark" src="icons/48x48.png" alt=""><div><strong>KeyHub</strong><small>PASSKEY</small></div><div class="ui-preferences"><label for="ui-language">语言 / Language</label><select id="ui-language"><option value="zh">中文</option><option value="en">English</option></select><label for="ui-theme">外观 / Theme</label><select id="ui-theme"><option value="system">跟随系统 / System</option><option value="light">浅色 / Light</option><option value="dark">深色 / Dark</option></select></div></header><main>
<h1 id="title">Passkey</h1><p class="website" id="origin"></p><p id="account" class="note"></p>
<form id="request-form" autocomplete="off"><label for="credential">账号 / Account</label><select id="credential"></select>
<div id="pin-panel" hidden><label for="pin">KeyHub PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off"></div>
<p id="note" class="note"></p><button id="confirm" type="submit">确认 / Confirm</button></form>
<button id="fallback" class="secondary">使用设备或安全密钥 / Use device</button><button id="cancel" class="secondary">取消 / Cancel</button><p id="error" role="alert"></p>
</main><script src="ui.js"></script><script src="request.js"></script></body></html>
