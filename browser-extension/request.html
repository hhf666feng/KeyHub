<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenKeylet · Passkey</title><link rel="stylesheet" href="popup.css"></head>
<body class="request-page"><header><img class="mark" src="icons/48x48.png" alt=""><div><strong>OpenKeylet</strong><small>PASSKEY</small></div></header><main>
<h1 id="title">Passkey</h1><p class="website" id="origin"></p><p id="account" class="note"></p>
<form id="request-form" autocomplete="off"><label for="credential">账号 / Account</label><select id="credential"></select>
<div id="pin-panel" hidden><label for="pin">OpenKeylet PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off"></div>
<p id="note" class="note"></p><button id="confirm" type="submit">确认 / Confirm</button></form>
<button id="fallback" class="secondary">使用设备或安全密钥 / Use device</button><button id="cancel" class="secondary">取消 / Cancel</button><p id="error" role="alert"></p>
</main><script src="request.js"></script></body></html>
